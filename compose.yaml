services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: search_autocomplete
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d search_autocomplete"]
      interval: 2s
      timeout: 2s
      retries: 15
